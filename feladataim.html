<style>
main{max-width:860px;margin:0 auto;padding:36px 22px 80px}
.gate{max-width:480px;margin:30px auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center}
.gate h2{margin:0 0 10px;font-size:22px}.gate p{color:var(--muted);margin:0 0 6px}
.fk{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin:0 0 16px;box-shadow:var(--shadow)}
.fk.uj{border-color:var(--patina);box-shadow:0 10px 26px rgba(31,111,100,.12)}
.fk-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.fk h3{margin:0;font-size:21px;flex:1;min-width:200px}
.st{display:inline-block;font:700 13px/1 var(--sans);padding:6px 10px;border-radius:999px;white-space:nowrap}
.st.kiadva{background:#E6ECF5;color:#2B4A73}.st.beadva{background:var(--ochre-soft);color:#6E4E12}.st.javitando{background:#F7E1DC;color:#8A2E1F}.st.kesz{background:var(--patina-soft);color:#164F47}
.hat{color:var(--muted);font-size:15px;margin-top:4px}.hat.lejart{color:#B53A27;font-weight:700}
.leiras{margin:12px 0 0;white-space:pre-line}
.fel{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.fel a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fel a:hover{border-color:var(--patina);color:var(--patina)}
.fel a.ok{background:var(--patina-soft);border-color:var(--patina-soft);color:#164F47}
.vj{margin:14px 0 0;background:#FAFAF6;border-left:4px solid var(--patina);padding:10px 14px;border-radius:0 10px 10px 0;white-space:pre-line}
.vj.jav{border-left-color:#C8432F}
.up{margin:16px 0 0;border-top:1px dashed var(--line);padding-top:14px}
.files{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.file{display:flex;align-items:center;gap:10px;font-size:15px;background:var(--bg);border-radius:10px;padding:8px 12px}
.file a{font-weight:700;text-decoration:none;color:var(--patina);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .x{margin-left:auto;background:none;border:0;color:#B53A27;font-weight:700;cursor:pointer;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{font:700 15.5px/1 var(--sans);border-radius:999px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.b.p{background:var(--patina);border-color:var(--patina);color:#fff}.b:disabled{opacity:.55;cursor:default}
.prog{font-size:14px;color:var(--muted)}
.ora{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ora b{font-family:var(--serif);font-size:17px;min-width:140px}
h2.sec{font-size:22px;margin:30px 0 12px}
.ures{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:16px;background:rgba(255,255,253,.6)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:200;max-width:92vw}
.toast.err{background:#B53A27}
@media(max-width:600px){main{padding:26px 14px 70px}.fk{padding:18px 16px}.ora b{min-width:0}}
</style>

  <div class="page-head" style="padding-top:20px"><span class="pill solo">Feladataim</span><p id="alcim">Itt találod a tőlem kapott feladatokat. A megoldásodat lefényképezve vagy PDF-ben töltheted fel.</p></div>
  <div id="app"><div class="gate"><p>Betöltés…</p></div></div>
</main>


<script>
(function(){ var tg=document.getElementById('menuToggle'), sm=document.getElementById('submenu'); if(!tg||!sm) return;
  tg.addEventListener('click',function(e){e.stopPropagation();var o=sm.classList.toggle('open');tg.classList.toggle('open',o);tg.setAttribute('aria-expanded',o);});

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js?v=23"></script>
<script src="/cookie-consent.js?v=3"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var ST = { kesz: {} };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dt(x) { return x ? new Date(x).toLocaleString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' }) : ''; }
function toast(m, err) { var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 5000 : 2500); }
var STN = { kiadva: 'Megoldásra vár', beadva: 'Beadva – átnézésre vár', javitando: 'Javítandó', kesz: 'Kész ✓' };
function api(muvelet, adat) {
  return PM.sb.auth.getSession().then(function (r) {
    var tok = r.data.session && r.data.session.access_token;
    if (!tok) throw { kod: 401, hiba: 'Lépj be a fiókodba.' };
    return fetch('/api/diak', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(Object.assign({ muvelet: muvelet }, adat || {})) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { if (!res.ok || !j.ok) throw { kod: res.status, hiba: j.hiba || 'Hiba történt.' }; return j.adat; }); });
  });
}
function gate(cim, szoveg, login) {
  $app.innerHTML = '<div class="gate"><h2>' + esc(cim) + '</h2><p>' + szoveg + '</p>' + (login ? '<p style="margin-top:16px"><button class="b p" id="lg">Belépés</button></p>' : '') + '</div>';
  var b = document.getElementById('lg'); if (b) b.onclick = function () { var x = document.querySelector('#authArea .pm-login'); if (x) x.click(); };
}

function betolt() {
  api('lista').then(function (d) {
    if (d.nincs) return gate('Még nincs kiadott feladatod', 'Ez az oldal a tanítványaimnak szól. Ha nálam tanulsz, szólj, és összekötöm a fiókodat – utána itt látod a feladataidat.');
    ST.kesz = {}; (d.kesz || []).forEach(function (k) { ST.kesz[k] = 1; });
    var nyitott = d.kiadasok.filter(function (k) { return k.statusz === 'kiadva' || k.statusz === 'javitando'; });
    var tobbi = d.kiadasok.filter(function (k) { return k.statusz === 'beadva' || k.statusz === 'kesz'; });
    var most = Date.now();
    var kov = d.orak.filter(function (o) { return o.statusz === 'tervezett' && Date.parse(o.kezdes) > most - 3600e3; }).reverse();
    $app.innerHTML = '<h2 class="sec" style="margin-top:6px">Megoldásra váró feladatok' + (nyitott.length ? ' (' + nyitott.length + ')' : '') + '</h2><div id="ny"></div>'
      + (kov.length ? '<h2 class="sec">Következő óráid</h2><div id="ko"></div>' : '')
      + '<h2 class="sec">Beadott és lezárt feladatok</h2><div id="tb"></div>';
    var ny = document.getElementById('ny'), tb = document.getElementById('tb');
    if (!nyitott.length) ny.innerHTML = '<div class="ures">Most nincs megoldásra váró feladatod. 🎉</div>';
    nyitott.forEach(function (k) { ny.appendChild(kartya(k, true)); });
    if (!tobbi.length) tb.innerHTML = '<div class="ures">Még nincs beadott feladatod.</div>';
    tobbi.forEach(function (k) { tb.appendChild(kartya(k, false)); });
    var ko = document.getElementById('ko');
    if (ko) kov.forEach(function (o) { var e = document.createElement('div'); e.className = 'ora'; e.innerHTML = '<b>' + esc(dt(o.kezdes)) + '</b><span class="prog">' + (o.perc || 60) + ' perc' + (o.tema ? ' · ' + esc(o.tema) : '') + '</span>'; ko.appendChild(e); });
  }, function (e) {
    if (e && e.kod === 401) return gate('Lépj be', 'A feladataidat a fiókodba belépve látod.', true);
    gate('Hiba', esc((e && e.hiba) || 'Nem sikerült betölteni.'));
  });
}

function kartya(k, nyitott) {
  var c = document.createElement('div'); c.className = 'fk' + (nyitott ? ' uj' : '');
  var lejart = k.hatarido && Date.parse(k.hatarido) < Date.now() && nyitott;
  var fel = (k.feladatok || []);
  c.innerHTML = '<div class="fk-top"><h3>' + esc(k.cim) + '</h3><span class="st ' + esc(k.statusz) + '">' + esc(STN[k.statusz] || k.statusz) + '</span></div>'
    + (k.hatarido ? '<div class="hat' + (lejart ? ' lejart' : '') + '">Határidő: ' + esc(dt(k.hatarido)) + (lejart ? ' – lejárt' : '') + '</div>' : '')
    + (k.leiras ? '<p class="leiras">' + esc(k.leiras) + '</p>' : '')
    + (fel.length ? '<div class="fel">' + fel.map(function (f) { var ok = ST.kesz[f.kulcs]; return '<a class="' + (ok ? 'ok' : '') + '" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + (ok ? '✓ ' : '') + esc(f.cim.replace(/^\d+\. o\. · /, '')) + ' ↗</a>'; }).join('') + '</div>' : '')
    + (k.visszajelzes ? '<div class="vj' + (k.statusz === 'javitando' ? ' jav' : '') + '"><b>Visszajelzés:</b> ' + esc(k.visszajelzes) + '</div>' : '')
    + '<div class="tanari"></div><div class="up"><div class="files"></div><div class="btns"></div></div>';
  var tanari = (k.beadas_fajlok || []).filter(function (f) { return f.tanartol; });
  if (tanari.length) {
    var tb = c.querySelector('.tanari');
    tb.innerHTML = '<div class="vj" style="margin-top:14px"><b>📎 Javított megoldás tőlem:</b><div class="files" style="margin:8px 0 0"></div></div>';
    tanari.forEach(function (f) {
      var e = document.createElement('div'); e.className = 'file'; e.style.background = '#fff';
      e.innerHTML = '<span>' + (f.tipus === 'application/pdf' ? '📄' : '🖼️') + '</span><a href="#">' + esc(f.nev || 'javítás') + '</a>';
      e.querySelector('a').onclick = function (ev) { ev.preventDefault(); var w = window.open('', '_blank'); api('fajl_link', { kiadas_id: k.id, id: f.id }).then(function (r) { w.location = r.url; }, function (er) { w.close(); toast(er.hiba, true); }); };
      tb.querySelector('.files').appendChild(e);
    });
  }
  var files = c.querySelector('.files'), btns = c.querySelector('.btns');
  var lista = (k.beadas_fajlok || []).filter(function (f) { return !f.tanartol; });
  var szerk = k.statusz === 'kiadva' || k.statusz === 'javitando';
  function rajz() {
    files.innerHTML = '';
    if (!lista.length && !szerk) files.innerHTML = '<span class="prog">Nincs feltöltött fájl.</span>';
    lista.forEach(function (f) {
      var e = document.createElement('div'); e.className = 'file';
      e.innerHTML = '<span>' + (f.tipus === 'application/pdf' ? '📄' : '🖼️') + '</span><a href="#">' + esc(f.nev || 'fájl') + '</a>' + (szerk ? '<button class="x" type="button">Törlés</button>' : '');
      e.querySelector('a').onclick = function (ev) { ev.preventDefault(); var w = window.open('', '_blank'); api('fajl_link', { kiadas_id: k.id, id: f.id }).then(function (r) { w.location = r.url; }, function (er) { w.close(); toast(er.hiba, true); }); };
      var x = e.querySelector('.x'); if (x) x.onclick = function () { if (!confirm('Törlöd ezt a fájlt?')) return; x.disabled = true; api('fajl_torles', { kiadas_id: k.id, id: f.id }).then(function () { lista = lista.filter(function (y) { return y.id !== f.id; }); rajz(); }, function (er) { x.disabled = false; toast(er.hiba, true); }); };
      files.appendChild(e);
    });
    btns.innerHTML = '';
    if (!szerk) return;
    var inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.accept = 'image/*,application/pdf'; inp.hidden = true;
    var up = document.createElement('button'); up.className = 'b'; up.type = 'button'; up.textContent = lista.length ? '+ Még egy fájl' : '📷 Fénykép / PDF feltöltése';
    up.onclick = function () { inp.click(); };
    inp.onchange = function () { feltolt([].slice.call(inp.files), up); };
    var bead = document.createElement('button'); bead.className = 'b p'; bead.type = 'button'; bead.textContent = k.statusz === 'javitando' ? 'Javítás beadása' : 'Beadás';
    bead.disabled = !lista.length;
    bead.onclick = function () {
      if (!confirm('Beadod a megoldást? Beadás után már nem tudsz fájlt törölni vagy hozzáadni.')) return;
      bead.disabled = true;
      api('beadas', { kiadas_id: k.id }).then(function () { toast('Beadva – köszönöm!'); betolt(); }, function (er) { bead.disabled = false; toast(er.hiba, true); });
    };
    btns.appendChild(inp); btns.appendChild(up); btns.appendChild(bead);
    if (!lista.length) { var s = document.createElement('span'); s.className = 'prog'; s.textContent = 'Kép (JPG, PNG, HEIC) vagy PDF, fájlonként max. 10 MB.'; btns.appendChild(s); }
  }
  function feltolt(fajlok, gomb) {
    if (!fajlok.length) return;
    gomb.disabled = true;
    var i = 0;
    (function kov() {
      if (i >= fajlok.length) { gomb.disabled = false; rajz(); return; }
      var f = fajlok[i++];
      var tipus = (f.type || '').toLowerCase();
      if (!tipus && /\.hei[cf]$/i.test(f.name)) tipus = 'image/heic';
      gomb.textContent = 'Feltöltés… (' + i + '/' + fajlok.length + ')';
      if (f.size > 10 * 1024 * 1024) { toast(f.name + ': nagyobb 10 MB-nál.', true); return kov(); }
      api('feltoltes_link', { kiadas_id: k.id, tipus: tipus, meret: f.size }).then(function (l) {
        return PM.sb.storage.from('beadasok').uploadToSignedUrl(l.utvonal, l.token, f, { contentType: tipus }).then(function (r) {
          if (r.error) throw { hiba: 'A feltöltés nem sikerült: ' + r.error.message };
          return api('fajl_mentes', { kiadas_id: k.id, utvonal: l.utvonal, nev: f.name, meret: f.size, tipus: tipus });
        });
      }).then(function (sor) { lista.push(sor); kov(); }, function (er) { toast((er && er.hiba) || 'A feltöltés nem sikerült.', true); kov(); });
    })();
  }
  rajz();
  return c;
}

var indult = false;
function indit(u) {
  if (!u) { indult = false; return gate('Lépj be', 'A feladataidat a fiókodba belépve látod.', true); }
  if (indult) return; indult = true; betolt();
}
PM.onChange(indit);
PM.sb.auth.getSession().then(function (r) { indit(r.data.session && r.data.session.user); });
})();
</script>
