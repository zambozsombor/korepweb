<style>
main{max-width:920px;margin:0 auto;padding:36px 22px 80px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.hello h1{margin:0;font-size:34px;line-height:1.1}.hello p{margin:4px 0 0;color:var(--muted)}
.qk{display:flex;gap:8px;flex-wrap:wrap}.qk a{font:700 14px/1 var(--sans);text-decoration:none;padding:10px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}.qk a:hover{border-color:var(--patina);color:var(--patina)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;text-decoration:none;color:inherit;display:block}
.stat b{display:block;font:800 30px/1.05 var(--serif)}.stat span{color:var(--muted);font-size:14.5px}
.stat.hot{border-color:#E7B7AE;background:#FCF1EE}.stat.hot b{color:#B53A27}
.hero{position:relative;background:#173C36;color:#F4F1E6;border-radius:24px;padding:24px 24px 22px;margin:0 0 8px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,209,38,.14)}
.hero .k{font:700 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#9FE3D3}
.hero h2{margin:10px 0 4px;font-size:30px;line-height:1.15;color:#fff}
.hero .rel{display:inline-block;margin-left:6px;font:700 14px/1 var(--sans);background:#FFD126;color:#1d1d1d;padding:6px 10px;border-radius:999px;vertical-align:4px}
.hero .meta{color:#CFE3DD;font-size:16px}
.hero .uz{margin:12px 0 0;background:rgba(255,255,255,.08);border-left:3px solid #FFD126;padding:10px 12px;border-radius:0 10px 10px 0;white-space:pre-line}
.hero .act{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.join{display:inline-flex;align-items:center;gap:9px;font:800 16px/1 var(--sans);text-decoration:none;padding:13px 18px;border-radius:999px;background:#FFD126;color:#1d1d1d}
.join.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,38,.6)}50%{box-shadow:0 0 0 10px rgba(255,209,38,0)}}
.hero .nolink{color:#CFE3DD;font-size:14.5px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;background:var(--bg);padding:12px 0 10px;margin:14px 0 4px;border-bottom:1px solid var(--line)}
.nav a{font:700 15px/1 var(--sans);text-decoration:none;padding:9px 14px;border-radius:999px;color:var(--ink)}.nav a:hover{background:var(--paper)}
.nav .cnt{display:inline-block;min-width:20px;padding:3px 6px;margin-left:4px;border-radius:999px;background:#C8432F;color:#fff;font-size:12px;text-align:center}
.lrow{display:flex;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.lrow .d{min-width:62px;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.lrow .d b{display:block;font:800 26px/1 var(--serif)}.lrow .d span{font:700 12px/1.3 var(--sans);text-transform:uppercase;color:var(--muted)}
.lrow .i{flex:1;min-width:0}.lrow .i b{font-size:16.5px}.lrow .i div{color:var(--muted);font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.lrow .i .u{color:var(--ink);white-space:pre-line;margin-top:4px}
.lrow.mult{opacity:.82}.lrow.lem{opacity:.6}.lrow.lem b{text-decoration:line-through}
.mini{font:700 14px/1 var(--sans);text-decoration:none;padding:10px 13px;border-radius:999px;background:var(--patina);color:#fff;white-space:nowrap}
.tag{font:700 12.5px/1 var(--sans);padding:5px 8px;border-radius:999px;background:#F7E1DC;color:#8A2E1F;white-space:nowrap}
.more{display:block;margin:6px auto 0;font:700 14.5px/1 var(--sans);background:none;border:0;color:var(--patina);cursor:pointer;padding:10px}
h2.sec{font-size:22px;margin:30px 0 12px;scroll-margin-top:70px}
h3.sub{font:800 14px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.hero h2{font-size:24px}.hello h1{font-size:28px}.lrow{flex-wrap:wrap}.lrow .i{flex:1 1 calc(100% - 90px)}.lrow .mini,.lrow .tag{margin-left:76px}}
.gate{max-width:480px;margin:30px auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:30px 26px;text-align:center}
.gate h2{margin:0 0 10px;font-size:22px}.gate p{color:var(--muted);margin:0 0 6px}
.fk{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin:0 0 16px;box-shadow:var(--shadow)}
.fk.uj{border-color:var(--patina);box-shadow:0 10px 26px rgba(31,111,100,.12)}
.fk-top{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.fk h3{margin:0;font-size:21px;flex:1;min-width:200px}
.st{display:inline-block;font:700 13px/1 var(--sans);padding:6px 10px;border-radius:999px;white-space:nowrap}
.st.kiadva{background:#E6ECF5;color:#2B4A73}.st.beadva{background:var(--ochre-soft);color:#6E4E12}.st.javitando{background:#F7E1DC;color:#8A2E1F}.st.kesz{background:var(--patina-soft);color:#164F47}
.hat{color:var(--muted);font-size:15px;margin-top:4px}.hat.lejart{color:#B53A27;font-weight:700}
.leiras{margin:12px 0 0;white-space:pre-line}
.fel{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.fel a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.fel a:hover{border-color:var(--patina);color:var(--patina)}
.fel a.ok{background:var(--patina-soft);border-color:var(--patina-soft);color:#164F47}
.vj{margin:14px 0 0;background:#FAFAF6;border-left:4px solid var(--patina);padding:10px 14px;border-radius:0 10px 10px 0;white-space:pre-line}
.vj.jav{border-left-color:#C8432F}
.up{margin:16px 0 0;border-top:1px dashed var(--line);padding-top:14px}
.files{display:flex;flex-direction:column;gap:6px;margin:0 0 12px}
.file{display:flex;align-items:center;gap:10px;font-size:15px;background:var(--bg);border-radius:10px;padding:8px 12px}
.file a{font-weight:700;text-decoration:none;color:var(--patina);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .x{margin-left:auto;background:none;border:0;color:#B53A27;font-weight:700;cursor:pointer;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.b{font:700 15.5px/1 var(--sans);border-radius:999px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.b.p{background:var(--patina);border-color:var(--patina);color:#fff}.b:disabled{opacity:.55;cursor:default}
.prog{font-size:14px;color:var(--muted)}
.ora{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ora b{font-family:var(--serif);font-size:17px;min-width:140px}
h2.sec{font-size:22px;margin:30px 0 12px}
.ures{color:var(--muted);text-align:center;padding:22px;border:1px dashed var(--line);border-radius:16px;background:rgba(255,255,253,.6)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:200;max-width:92vw}
.toast.err{background:#B53A27}
@media(max-width:600px){main{padding:26px 14px 70px}.fk{padding:18px 16px}.ora b{min-width:0}}
</style>

<script src="auth.js?v=24"></script>
<script src="/cookie-consent.js?v=3"></script>
<script>
(function () {
'use strict';
var $app = document.getElementById('app');
var ST = { kesz: {} };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dt(x) { return x ? new Date(x).toLocaleString('hu-HU', { month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit' }) : ''; }
function toast(m, err) { var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, err ? 5000 : 2500); }
var STN = { kiadva: 'Megoldásra vár', beadva: 'Beadva – átnézésre vár', javitando: 'Javítandó', kesz: 'Kész ✓' };
function api(muvelet, adat) {
  return PM.sb.auth.getSession().then(function (r) {
    var tok = r.data.session && r.data.session.access_token;
    if (!tok) throw { kod: 401, hiba: 'Lépj be a fiókodba.' };
    return fetch('/api/diak', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok }, body: JSON.stringify(Object.assign({ muvelet: muvelet }, adat || {})) })
      .then(function (res) { return res.json().catch(function () { return {}; }).then(function (j) { if (!res.ok || !j.ok) throw { kod: res.status, hiba: j.hiba || 'Hiba történt.' }; return j.adat; }); });
  });
}
function gate(cim, szoveg, login) {
  $app.innerHTML = '<div class="gate"><h2>' + esc(cim) + '</h2><p>' + szoveg + '</p>' + (login ? '<p style="margin-top:16px"><button class="b p" id="lg">Belépés</button></p>' : '') + '</div>';
  var b = document.getElementById('lg'); if (b) b.onclick = function () { var x = document.querySelector('#authArea .pm-login'); if (x) x.click(); };
}

var NAP = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
function ido(x) { return new Date(x).toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' }); }
function nap(x) { var d = new Date(x); return NAP[d.getDay()].replace(/^./, function (c) { return c.toUpperCase(); }) + ', ' + d.toLocaleDateString('hu-HU', { month: 'long', day: 'numeric' }); }
function napKul(x) { var a = new Date(); a.setHours(0, 0, 0, 0); var b = new Date(x); b.setHours(0, 0, 0, 0); return Math.round((b - a) / 864e5); }
function relativ(o) {
  var k = Date.parse(o.kezdes), v = k + o.perc * 60e3, m = Date.now();
  if (m >= k && m < v) return 'Most zajlik';
  if (m >= k - 15 * 60e3 && m < k) return Math.max(1, Math.ceil((k - m) / 60e3)) + ' perc múlva';
  var n = napKul(o.kezdes);
  if (n === 0) return 'Ma'; if (n === 1) return 'Holnap'; return n + ' nap múlva';
}
function belephet(o) { var k = Date.parse(o.kezdes); return Date.now() >= k - 15 * 60e3 && Date.now() < k + o.perc * 60e3; }
var MEET_IKON = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15 8.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-1.5l4.3 3.1c.66.48 1.7.01 1.7-.81V6.21c0-.82-1.04-1.29-1.7-.81z"/></svg>';

function betolt() {
  api('lista').then(function (d) {
    if (d.nincs) return gate('Még nincs saját felületed', 'Ez az oldal a tanítványaimnak szól. Ha nálam tanulsz, szólj, és összekötöm a fiókodat – utána itt látod a feladataidat és az óráidat.');
    ST.d = d; rajzol();
  }, function (e) {
    if (e && e.kod === 401) return gate('Lépj be', 'A saját felületedet a fiókodba belépve látod.', true);
    gate('Hiba', esc((e && e.hiba) || 'Nem sikerült betölteni.'));
  });
}

function rajzol() {
  var d = ST.d;
  ST.kesz = {}; (d.kesz || []).forEach(function (k) { ST.kesz[k] = 1; });
  var nyitott = d.kiadasok.filter(function (k) { return k.statusz === 'kiadva' || k.statusz === 'javitando'; });
  var tobbi = d.kiadasok.filter(function (k) { return k.statusz === 'beadva' || k.statusz === 'kesz'; });
  var kov = d.jovobeli.filter(function (o) { return o.statusz === 'tervezett'; });
  var elso = kov[0];
  var lejart = nyitott.filter(function (k) { return k.hatarido && Date.parse(k.hatarido) < Date.now(); }).length;

  var h = '<div class="hello"><div><h1>Szia, ' + esc(d.nev) + '!</h1><p>Itt találod a feladataidat és az óráidat.</p></div>'
    + '<div class="qk"><a href="/feladatadatbazis.html">Felvételi feladatok</a><a href="/erettsegi/">Érettségi feladatok</a><a href="/haladas.html">Haladásom</a></div></div>';
  h += '<div class="stats">'
    + '<a class="stat' + (nyitott.length ? ' hot' : '') + '" href="#feladatok"><b>' + nyitott.length + '</b><span>megoldásra váró feladat' + (lejart ? ' · ' + lejart + ' lejárt' : '') + '</span></a>'
    + '<a class="stat" href="#orak"><b>' + kov.length + '</b><span>következő óra</span></a>'
    + '<a class="stat" href="#korabbi"><b>' + d.megtartott_db + '</b><span>eddigi óra</span></a></div>';

  if (elso) {
    var live = belephet(elso);
    h += '<div class="hero"><div class="k">' + (live ? (Date.now() < Date.parse(elso.kezdes) ? 'Hamarosan kezdődik az órád' : 'Az órád most zajlik') : 'Következő órád') + '</div>'
      + '<h2>' + esc(nap(elso.kezdes)) + ' · ' + esc(ido(elso.kezdes)) + '<span class="rel" data-rel="0">' + esc(relativ(elso)) + '</span></h2>'
      + '<div class="meta">' + elso.perc + ' perc' + (elso.hely ? ' · ' + esc(elso.hely) : '') + (elso.tema ? ' · ' + esc(elso.tema) : '') + '</div>'
      + (elso.uzenet ? '<div class="uz">' + esc(elso.uzenet) + '</div>' : '')
      + '<div class="act">' + (elso.link ? '<a class="join' + (live ? ' live' : '') + '" href="' + esc(elso.link) + '" target="_blank" rel="noopener">' + MEET_IKON + 'Belépés az órára</a>'
        : (elso.online ? '<span class="nolink">Az óra linkjét hamarosan itt találod.</span>' : '')) + '</div></div>';
  } else {
    h += '<div class="ures" style="margin-bottom:8px">Jelenleg nincs beírt következő órád.</div>';
  }

  h += '<nav class="nav"><a href="#feladatok">Feladatok' + (nyitott.length ? '<span class="cnt">' + nyitott.length + '</span>' : '') + '</a><a href="#orak">Órák</a><a href="#lezart">Lezárt feladatok</a></nav>';
  h += '<h2 class="sec" id="feladatok">Megoldásra váró feladatok</h2><div id="ny"></div>';
  h += '<h2 class="sec" id="orak">Óráid</h2><h3 class="sub">Következő órák</h3><div id="ko"></div><h3 class="sub" id="korabbi">Korábbi órák</h3><div id="mu"></div>';
  h += '<h2 class="sec" id="lezart">Beadott és lezárt feladatok</h2><div id="tb"></div>';
  $app.innerHTML = h;

  var ny = document.getElementById('ny'), tb = document.getElementById('tb');
  if (!nyitott.length) ny.innerHTML = '<div class="ures">Most nincs megoldásra váró feladatod. 🎉</div>';
  nyitott.forEach(function (k) { ny.appendChild(kartya(k, true)); });
  if (!tobbi.length) tb.innerHTML = '<div class="ures">Még nincs beadott feladatod.</div>';
  tobbi.forEach(function (k) { tb.appendChild(kartya(k, false)); });

  var ko = document.getElementById('ko');
  if (!d.jovobeli.length) ko.innerHTML = '<div class="ures">Nincs beírt következő órád.</div>';
  d.jovobeli.forEach(function (o) { ko.appendChild(oraSor(o, false)); });
  var mu = document.getElementById('mu');
  if (!d.korabbi.length) mu.innerHTML = '<div class="ures">Még nem volt órád.</div>';
  var LATSZIK = 6;
  d.korabbi.forEach(function (o, i) { var e = oraSor(o, true); if (i >= LATSZIK) e.hidden = true; mu.appendChild(e); });
  if (d.korabbi.length > LATSZIK) {
    var mb = document.createElement('button'); mb.className = 'more'; mb.type = 'button'; mb.textContent = 'Összes korábbi óra (' + d.korabbi.length + ')';
    mb.onclick = function () { [].forEach.call(mu.querySelectorAll('.lrow[hidden]'), function (x) { x.hidden = false; }); mb.remove(); };
    mu.appendChild(mb);
  }
}

function oraSor(o, mult) {
  var e = document.createElement('div'); var dd = new Date(o.kezdes);
  var lem = o.statusz === 'lemondott';
  e.className = 'lrow' + (mult ? ' mult' : '') + (lem ? ' lem' : '');
  e.innerHTML = '<div class="d"><b>' + dd.getDate() + '</b><span>' + esc(dd.toLocaleDateString('hu-HU', { month: 'short' }).replace('.', '')) + '<br>' + esc(NAP[dd.getDay()].slice(0, 3)) + '</span></div>'
    + '<div class="i"><b>' + esc(ido(o.kezdes)) + '</b> <span class="prog">· ' + o.perc + ' perc' + (o.hely ? ' · ' + esc(o.hely) : '') + '</span>'
    + (o.tema ? '<div>' + esc(o.tema) + '</div>' : '') + (o.uzenet && !mult ? '<div class="u">' + esc(o.uzenet) + '</div>' : '') + '</div>'
    + (lem ? '<span class="tag">Elmarad</span>' : (o.link ? '<a class="mini" href="' + esc(o.link) + '" target="_blank" rel="noopener">Belépés</a>' : ''));
  return e;
}

setInterval(function () { var r = document.querySelector('.hero .rel'); if (!r || !ST.d) return; var e = ST.d.jovobeli.filter(function (o) { return o.statusz === 'tervezett'; })[0]; if (!e) return; r.textContent = relativ(e); var j = document.querySelector('.hero .join'); if (j) j.classList.toggle('live', belephet(e)); var k = document.querySelector('.hero .k'); if (k) k.textContent = belephet(e) ? (Date.now() < Date.parse(e.kezdes) ? 'Hamarosan kezdődik az órád' : 'Az órád most zajlik') : 'Következő órád'; }, 30e3);

function kartya(k, nyitott) {
  var c = document.createElement('div'); c.className = 'fk' + (nyitott ? ' uj' : '');
  var lejart = k.hatarido && Date.parse(k.hatarido) < Date.now() && nyitott;
  var fel = (k.feladatok || []);
  c.innerHTML = '<div class="fk-top"><h3>' + esc(k.cim) + '</h3><span class="st ' + esc(k.statusz) + '">' + esc(STN[k.statusz] || k.statusz) + '</span></div>'
    + (k.hatarido ? '<div class="hat' + (lejart ? ' lejart' : '') + '">Határidő: ' + esc(dt(k.hatarido)) + (lejart ? ' – lejárt' : '') + '</div>' : '')
    + (k.leiras ? '<p class="leiras">' + esc(k.leiras) + '</p>' : '')
    + (fel.length ? '<div class="fel">' + fel.map(function (f) { var ok = ST.kesz[f.kulcs]; return '<a class="' + (ok ? 'ok' : '') + '" href="' + esc(f.url) + '" target="_blank" rel="noopener">' + (ok ? '✓ ' : '') + esc(f.cim.replace(/^\d+\. o\. · /, '')) + ' ↗</a>'; }).join('') + '</div>' : '')
    + (k.visszajelzes ? '<div class="vj' + (k.statusz === 'javitando' ? ' jav' : '') + '"><b>Visszajelzés:</b> ' + esc(k.visszajelzes) + '</div>' : '')
    + '<div class="tanari"></div><div class="up"><div class="files"></div><div class="btns"></div></div>';
  var tanari = (k.beadas_fajlok || []).filter(function (f) { return f.tanartol; });
  if (tanari.length) {
    var tb = c.querySelector('.tanari');
    tb.innerHTML = '<div class="vj" style="margin-top:14px"><b>📎 Javított megoldás tőlem:</b><div class="files" style="margin:8px 0 0"></div></div>';
    tanari.forEach(function (f) {
      var e = document.createElement('div'); e.className = 'file'; e.style.background = '#fff';
      e.innerHTML = '<span>' + (f.tipus === 'application/pdf' ? '📄' : '🖼️') + '</span><a href="#">' + esc(f.nev || 'javítás') + '</a>';
      e.querySelector('a').onclick = function (ev) { ev.preventDefault(); var w = window.open('', '_blank'); api('fajl_link', { kiadas_id: k.id, id: f.id }).then(function (r) { w.location = r.url; }, function (er) { w.close(); toast(er.hiba, true); }); };
      tb.querySelector('.files').appendChild(e);
    });
  }
  var files = c.querySelector('.files'), btns = c.querySelector('.btns');
  var lista = (k.beadas_fajlok || []).filter(function (f) { return !f.tanartol; });
  var szerk = k.statusz === 'kiadva' || k.statusz === 'javitando';
  function rajz() {
    files.innerHTML = '';
    if (!lista.length && !szerk) files.innerHTML = '<span class="prog">Nincs feltöltött fájl.</span>';
    lista.forEach(function (f) {
      var e = document.createElement('div'); e.className = 'file';
      e.innerHTML = '<span>' + (f.tipus === 'application/pdf' ? '📄' : '🖼️') + '</span><a href="#">' + esc(f.nev || 'fájl') + '</a>' + (szerk ? '<button class="x" type="button">Törlés</button>' : '');
      e.querySelector('a').onclick = function (ev) { ev.preventDefault(); var w = window.open('', '_blank'); api('fajl_link', { kiadas_id: k.id, id: f.id }).then(function (r) { w.location = r.url; }, function (er) { w.close(); toast(er.hiba, true); }); };
      var x = e.querySelector('.x'); if (x) x.onclick = function () { if (!confirm('Törlöd ezt a fájlt?')) return; x.disabled = true; api('fajl_torles', { kiadas_id: k.id, id: f.id }).then(function () { lista = lista.filter(function (y) { return y.id !== f.id; }); rajz(); }, function (er) { x.disabled = false; toast(er.hiba, true); }); };
      files.appendChild(e);
    });
    btns.innerHTML = '';
    if (!szerk) return;
    var inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.accept = 'image/*,application/pdf'; inp.hidden = true;
    var up = document.createElement('button'); up.className = 'b'; up.type = 'button'; up.textContent = lista.length ? '+ Még egy fájl' : '📷 Fénykép / PDF feltöltése';
    up.onclick = function () { inp.click(); };
    inp.onchange = function () { feltolt([].slice.call(inp.files), up); };
    var bead = document.createElement('button'); bead.className = 'b p'; bead.type = 'button'; bead.textContent = k.statusz === 'javitando' ? 'Javítás beadása' : 'Beadás';
    bead.disabled = !lista.length;
    bead.onclick = function () {
      if (!confirm('Beadod a megoldást? Beadás után már nem tudsz fájlt törölni vagy hozzáadni.')) return;
      bead.disabled = true;
      api('beadas', { kiadas_id: k.id }).then(function () { toast('Beadva – köszönöm!'); betolt(); }, function (er) { bead.disabled = false; toast(er.hiba, true); });
    };
    btns.appendChild(inp); btns.appendChild(up); btns.appendChild(bead);
    if (!lista.length) { var s = document.createElement('span'); s.className = 'prog'; s.textContent = 'Kép (JPG, PNG, HEIC) vagy PDF, fájlonként max. 10 MB.'; btns.appendChild(s); }
  }
  function feltolt(fajlok, gomb) {
    if (!fajlok.length) return;
    gomb.disabled = true;
    var i = 0;
    (function kov() {
      if (i >= fajlok.length) { gomb.disabled = false; rajz(); return; }
      var f = fajlok[i++];
      var tipus = (f.type || '').toLowerCase();
      if (!tipus && /\.hei[cf]$/i.test(f.name)) tipus = 'image/heic';
      gomb.textContent = 'Feltöltés… (' + i + '/' + fajlok.length + ')';
      if (f.size > 10 * 1024 * 1024) { toast(f.name + ': nagyobb 10 MB-nál.', true); return kov(); }
      api('feltoltes_link', { kiadas_id: k.id, tipus: tipus, meret: f.size }).then(function (l) {
        return PM.sb.storage.from('beadasok').uploadToSignedUrl(l.utvonal, l.token, f, { contentType: tipus }).then(function (r) {
          if (r.error) throw { hiba: 'A feltöltés nem sikerült: ' + r.error.message };
          return api('fajl_mentes', { kiadas_id: k.id, utvonal: l.utvonal, nev: f.name, meret: f.size, tipus: tipus });
        });
      }).then(function (sor) { lista.push(sor); kov(); }, function (er) { toast((er && er.hiba) || 'A feltöltés nem sikerült.', true); kov(); });
    })();
  }
  rajz();
  return c;
}

var indult = false;
function indit(u) {
  if (!u) { indult = false; return gate('Lépj be', 'A saját felületedet a fiókodba belépve látod.', true); }
  if (indult) return; indult = true; betolt();
}
PM.onChange(indit);
PM.sb.auth.getSession().then(function (r) { indit(r.data.session && r.data.session.user); });
})();
</script>
